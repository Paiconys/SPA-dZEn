services:
  db:
    image: mysql:8.4
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: spa_dzen
      MYSQL_USER: spa_user
      MYSQL_PASSWORD: spa_password
      MYSQL_ROOT_PASSWORD: spa_root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "spa_user", "-pspa_password"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: on-failure

volumes:
  mysql_data: